[build-system]
# setuptools 77 is the first release accepting the PEP 639 SPDX license expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-tabular-permissions"
description = "Display django permissions in a tabular format that is user friendly, and highly customisable"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
    { name = "Alessandro Hecht", email = "alessandrohc@gmail.com" },
]
maintainers = [
    { name = "Alessandro Hecht", email = "alessandrohc@gmail.com" },
]
dependencies = [
    "Django>=4.2,<6.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/alessandrohc/django-tabular-permissions"
Source = "https://github.com/alessandrohc/django-tabular-permissions"
Changelog = "https://github.com/alessandrohc/django-tabular-permissions/blob/master/CHANGELOG.rst"

[tool.setuptools]
packages = ["tabular_permissions"]

[tool.setuptools.dynamic]
# Single source of truth for the version. The module holds nothing but the string, so
# importing it at build time pulls in no dependency.
version = { attr = "tabular_permissions.__version__" }

[tool.setuptools.package-data]
# Without these the wheel ships only the .py files, and the widget dies on a
# TemplateDoesNotExist at the consumer's first render.
tabular_permissions = [
    "templates/**/*.html",
    "static/**/*.js",
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
]
